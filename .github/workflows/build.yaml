name: Docker Build

on:
  pull_request:
    branches-ignore:
      - main

concurrency:
  group: docker-build-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Validate requirement branch suffix
    runs-on: ubuntu-latest
    steps:
      - name: Require a positive requirement ID suffix
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$PR_SOURCE_BRANCH" =~ -[1-9][0-9]*$ ]]; then
            echo '::error::PR source branch must end with a positive requirement ID, for example feat/desktop-login-alignment-2600.'
            exit 1
          fi

  build:
    needs: [branch-name]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: app:test
          platforms: |
            linux/amd64
            linux/arm64
